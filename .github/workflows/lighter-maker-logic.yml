name: Lighter maker-first regression tests

on:
  push:
    branches: [master]
    paths:
      - 'scripts/replay_lighter_causal_maker_first_15d.py'
      - 'scripts/forwardtest_lighter_spread_grid_15d.py'
      - 'scripts/analyze_lighter_spread_feasibility.py'
      - 'tests/test_lighter_causal_maker_first_15d.py'
      - '.github/workflows/lighter-maker-logic.yml'
  workflow_dispatch:

jobs:
  independent-fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test tools
        run: python -m pip install 'pytest>=8,<10'
      - name: Check syntax of both execution engines
        run: |
          python -m py_compile scripts/replay_lighter_causal_maker_first_15d.py
          python -m py_compile scripts/forwardtest_lighter_spread_grid_15d.py
      - name: Run golden maker-first fixtures
        run: python -m pytest -q tests/test_lighter_causal_maker_first_15d.py
