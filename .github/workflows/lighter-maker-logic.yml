name: Lighter maker-first regression tests

on:
  push:
    branches: [master]
    paths:
      - 'scripts/replay_lighter_causal_maker_first_15d.py'
      - 'scripts/forwardtest_lighter_spread_grid_15d.py'
      - 'scripts/analyze_lighter_spread_feasibility.py'
      - 'tests/test_lighter_causal_maker_first_15d.py'
      - 'scripts/collect_lighter_targeted_1s_l3.py'
      - 'tests/test_collect_lighter_targeted_1s_l3.py'
      - 'scripts/download_lighter_l2_1s_full.py'
      - 'tests/test_download_lighter_l2_1s_full.py'
      - 'scripts/audit_lighter_l2_1s_source.py'
      - 'tests/test_audit_lighter_l2_1s_source.py'
      - 'scripts/replay_lighter_1s_frozen_tp2_tp3.py'
      - 'tests/test_replay_lighter_1s_frozen_tp2_tp3.py'
      - 'scripts/run_lighter_1s_tp2_tp3_wsl.sh'
      - '.github/workflows/lighter-maker-logic.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  independent-fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal test tools
        run: python -m pip install 'pytest>=8,<10'
      - name: Check syntax of both execution engines
        run: |
          python -m py_compile scripts/replay_lighter_causal_maker_first_15d.py
          python -m py_compile scripts/forwardtest_lighter_spread_grid_15d.py
          python -m py_compile scripts/collect_lighter_targeted_1s_l3.py
          python -m py_compile scripts/download_lighter_l2_1s_full.py
          python -m py_compile scripts/audit_lighter_l2_1s_source.py
          python -m py_compile scripts/replay_lighter_1s_frozen_tp2_tp3.py
          bash -n scripts/run_lighter_1s_tp2_tp3_wsl.sh
      - name: Run golden maker-first fixtures
        run: python -m pytest -q tests/test_lighter_causal_maker_first_15d.py tests/test_collect_lighter_targeted_1s_l3.py tests/test_download_lighter_l2_1s_full.py tests/test_audit_lighter_l2_1s_source.py tests/test_replay_lighter_1s_frozen_tp2_tp3.py
      - name: Publish fixture status to commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$TEST_JOB_STATUS" = "success" ]; then state=success; else state=failure; fi
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context="lighter-maker-regression" \
            -f description="Maker first regression tests: $state"
